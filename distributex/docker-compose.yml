version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: distributex-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: distributex
    volumes:
      - mongodb_data:/data/db
    networks:
      - distributex-network

  redis:
    image: redis:latest
    container_name: distributex-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - distributex-network

volumes:
  mongodb_data:

networks:
  distributex-network:
    driver: bridge